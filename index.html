<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal de Classe Maternelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-indigo-700">🎒 Mon Journal de Classe Numérique</h1>
            <p class="text-gray-600">Enseignement Maternel — Fédération Wallonie-Bruxelles</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md h-fit">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">➕ Ajouter une Activité</h2>
                
                <form id="journalForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Date</label>
                        <input type="date" id="dateInput" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Moment de la journée</label>
                        <select id="momentInput" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                            <option>Accueil / Rituels</option>
                            <option>Matinée (Activité)</option>
                            <option>Récréation</option>
                            <option>Après-midi (Activité)</option>
                            <option>Fin de journée</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nom de l'activité</label>
                        <input type="text" id="titreInput" placeholder="Ex: Peinture aux doigts, Tri de formes..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Domaine de développement (Pacte)</label>
                        <select id="domaineInput" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                            <option>Visées transversales (Autonomie, Socialisation)</option>
                            <option>1. Éducation culturelle et artistique (Arts, Musique)</option>
                            <option>2. Éveils aux langues / Français</option>
                            <option>3. Mathématiques (Logique, Nombres, Formes)</option>
                            <option>4. Sciences, Sciences humaines, Philosophie</option>
                            <option>5. Éducation physique, psychomotricité et santé</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Description / Déroulement</label>
                        <textarea id="descInput" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Observations</label>
                        <textarea id="obsInput" rows="2" placeholder="Ce qui a fonctionné, les difficultés..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-md hover:bg-indigo-700 font-medium transition">
                        Enregistrer dans le journal
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-xl font-semibold text-gray-800">📋 Déroulement des journées</h2>
                        <button id="clearBtn" class="text-xs text-red-500 hover:underline">Effacer tout le journal</button>
                    </div>
                    
                    <div id="journalEntries" class="space-y-4">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sélection des éléments
        const form = document.getElementById('journalForm');
        const entriesContainer = document.getElementById('journalEntries');
        const clearBtn = document.getElementById('clearBtn');

        // Mettre la date du jour par défaut
        document.getElementById('dateInput').valueAsDate = new Date();

        // Charger les données existantes ou créer un tableau vide
        let journalData = JSON.parse(localStorage.getItem('monJournalMaternelle')) || [];

        // Fonction pour afficher les entrées à l'écran
        function afficherJournal() {
            entriesContainer.innerHTML = '';

            if (journalData.length === 0) {
                entriesContainer.innerHTML = `<p class="text-gray-500 italic text-center py-4">Le journal est vide. Ajoutez votre première activité !</p>`;
                return;
            }

            // Trier du plus récent au plus ancien
            const dataTrie = [...journalData].reverse();

            dataTrie.forEach((entree) => {
                const div = document.createElement('div');
                div.className = "p-4 border rounded-lg bg-gray-50 shadow-sm space-y-2 border-l-4 border-l-indigo-500";
                
                // Formater la date en français
                const dateFormatee = new Date(entree.date).toLocaleDateString('fr-BE');

                div.innerHTML = `
                    <div class="flex justify-between items-start flex-wrap gap-2">
                        <div>
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">${entree.moment}</span>
                            <h3 class="text-lg font-bold text-gray-800 mt-1">${entree.titre}</h3>
                        </div>
                        <span class="text-sm text-gray-500 font-medium">${dateFormatee}</span>
                    </div>
                    <p class="text-xs text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded inline-block">🎯 ${entree.domaine}</p>
                    <p class="text-sm text-gray-700 whitespace-pre-line"><strong>Déroulement :</strong> ${entree.description || '/'}</p>
                    ${entree.observations ? `<div class="mt-2 text-sm bg-amber-50 p-2 rounded text-amber-900 border-l-2 border-amber-400"><strong>Obs :</strong> ${entree.observations}</div>` : ''}
                `;
                entriesContainer.appendChild(div);
            });
        }

        // Écouter la soumission du formulaire
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche la page de se recharger

            // Créer le nouvel objet activité
            const nouvelleActivite = {
                id: Date.now(),
                date: document.getElementById('dateInput').value,
                moment: document.getElementById('momentInput').value,
                titre: document.getElementById('titreInput').value,
                domaine: document.getElementById('domaineInput').value,
                description: document.getElementById('descInput').value,
                observations: document.getElementById('obsInput').value
            };

            // Ajouter au tableau, sauvegarder et rafraîchir l'affichage
            journalData.push(nouvelleActivite);
            localStorage.setItem('monJournalMaternelle', JSON.stringify(journalData));
            
            afficherJournal();

            // Réinitialiser les champs de texte
            document.getElementById('titreInput').value = '';
            document.getElementById('descInput').value = '';
            document.getElementById('obsInput').value = '';
        });

        // Bouton pour tout effacer
        clearBtn.addEventListener('click', function() {
            if (confirm("Voulez-vous vraiment effacer tout votre journal ? Cette action est irréversible.")) {
                journalData = [];
                localStorage.removeItem('monJournalMaternelle');
                afficherJournal();
            }
        });

        // Affichage initial au chargement de la page
        afficherJournal();
    </script>
</body>
</html>
