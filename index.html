<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal de Classe Maternelle — Édition Ultime FWB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-full-width { width: 100% !important; max-width: 100% !important; }
            .page-break-inside-avoid { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- En-tête -->
        <header class="mb-6 text-center md:text-left flex justify-between items-center flex-wrap gap-4 border-b pb-4 border-gray-300">
            <div>
                <h1 class="text-3xl font-bold text-indigo-700">🎒 Mon Journal de Classe Numérique</h1>
                <p class="text-gray-600">Référentiel FWB, Dictée Vocale, Suivi Élèves & Bilans Évolutifs</p>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="exporterJournal()" class="bg-blue-600 text-white px-3 py-2 rounded-lg hover:bg-blue-700 font-medium text-sm shadow transition">
                    💾 Sauvegarder (Export)
                </button>
                <label class="bg-amber-600 text-white px-3 py-2 rounded-lg hover:bg-amber-700 font-medium text-sm shadow transition cursor-pointer">
                    📂 Charger (Import)
                    <input type="file" id="importInput" accept=".json" class="hidden" onchange="importerJournal(this)">
                </label>
                <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium text-sm shadow transition flex items-center gap-2">
                    🖨️ Imprimer / PDF
                </button>
            </div>
        </header>

        <!-- Système de Navigation par Onglets (Masqué à l'impression) -->
        <div class="flex border-b border-gray-300 mb-6 no-print">
            <button id="tabJournalBtn" onclick="changerOnglet('journal')" class="py-2.5 px-4 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 transition">
                📋 Journal de classe & Encodage
            </button>
            <button id="tabBilanBtn" onclick="changerOnglet('bilan')" class="py-2.5 px-4 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">
                📊 Tableaux de Bord & Profils Élèves
            </button>
        </div>

        <!-- ================= ONGLET 1 : JOURNAL DE CLASSE ================= -->
        <div id="ongletJournal" class="grid grid-cols-1 lg:grid-cols-3 gap-8 print-full-width">
            
            <!-- FORMULAIRE DE SAISIE (GAUCHE) -->
            <div class="space-y-6 no-print">
                <!-- GESTION DES ÉLÈVES -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-md font-bold mb-3 text-gray-800 border-b pb-1">👥 Gestion de la Classe</h2>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="nouvelEleveInput" placeholder="Prénom de l'élève..." class="rounded-md border-gray-300 p-2 border text-sm w-full">
                        <button type="button" onclick="ajouterEleve()" class="bg-indigo-600 text-white px-3 py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">Ajouter</button>
                    </div>
                    <div id="listeElevesGestion" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-1 bg-gray-50 rounded border"></div>
                </div>

                <!-- ATELIER -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">➕ Nouvelle Activité</h2>
                    <form id="journalForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500">Date</label>
                                <input type="date" id="dateInput" class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500">Moment</label>
                                <select id="momentInput" class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm">
                                    <option>Accueil / Rituels</option>
                                    <option>Matinée (Activité)</option>
                                    <option>Récréation</option>
                                    <option>Après-midi</option>
                                    <option>Fin de journée</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500">Nom de l'activité</label>
                            <input type="text" id="titreInput" placeholder="Ex: Tracés de ponts..." class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500">Domaine</label>
                            <select id="domaineInput" class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm" onchange="mettreAJourObjectifs()">
                                <option value="transversal">Visées transversales</option>
                                <option value="art">1. Éducation culturelle et artistique</option>
                                <option value="langues">2. Français & Arts de la parole</option>
                                <option value="math">3. Mathématiques</option>
                                <option value="sciences">4. Sciences & Citoyenneté</option>
                                <option value="sante">5. Psychomotricité et santé</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500">Attendu / Compétence</label>
                            <select id="objectifInput" class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm bg-gray-50"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Groupes</label>
                            <div class="grid grid-cols-2 gap-2 bg-gray-50 p-2 rounded-md border text-sm">
                                <label class="flex items-center gap-2"><input type="checkbox" class="groupe-chk" value="Classe entière" checked> Classe entière</label>
                                <label class="flex items-center gap-2"><input type="checkbox" class="groupe-chk" value="Petits (M1)"> Petits (M1)</label>
                                <label class="flex items-center gap-2"><input type="checkbox" class="groupe-chk" value="Moyens (M2)"> Moyens (M2)</label>
                                <label class="flex items-center gap-2"><input type="checkbox" class="groupe-chk" value="Grands (M3)"> Grands (M3)</label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">🎯 Suivi des Élèves à cet atelier</label>
                            <div id="grilleSuiviFormulaire" class="border rounded-md p-2 bg-gray-50 space-y-1 max-h-40 overflow-y-auto text-xs"></div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center"><label class="block text-xs font-semibold uppercase text-gray-500">Déroulement</label><button type="button" onclick="activerDictee('descInput')" class="text-xs text-indigo-600 font-medium">🎙️ Dicter</button></div>
                            <textarea id="descInput" rows="2" class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm"></textarea>
                        </div>
                        <div>
                            <div class="flex justify-between items-center"><label class="block text-xs font-semibold uppercase text-gray-500">Observations</label><button type="button" onclick="activerDictee('obsInput')" class="text-xs text-indigo-600 font-medium">🎙️ Dicter</button></div>
                            <textarea id="obsInput" rows="2" class="mt-1 block w-full rounded-md border-gray-300 p-2 border text-sm"></textarea>
                        </div>
                        <div>
                            <input type="file" id="photoInput" accept="image/*" class="block w-full text-xs text-gray-500">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white p-2.5 rounded-lg font-medium shadow hover:bg-indigo-700 transition">Enregistrer la fiche</button>
                    </form>
                </div>
            </div>

            <!-- VUE FLUX CHRONOLOGIQUE (DROITE) -->
            <div class="lg:col-span-2 print-full-width">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <div class="no-print bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200 flex flex-wrap gap-3 items-center justify-between">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 w-full md:w-auto">
                            <input type="text" id="rechercheTexte" placeholder="Mot-clé..." class="rounded-md border-gray-300 p-1.5 border text-sm">
                            <select id="filtreDomaine" class="rounded-md border-gray-300 p-1.5 border text-sm">
                                <option value="Tous">Tous les domaines</option>
                                <option value="Visées transversales">Visées transversales</option>
                                <option value="Éducation culturelle">1. Arts / Culture</option>
                                <option value="Français">2. Français</option>
                                <option value="Mathématiques">3. Mathématiques</option>
                                <option value="Sciences">4. Sciences / Philo</option>
                                <option value="Éducation physique">5. Psychomotricité</option>
                            </select>
                        </div>
                        <button id="clearBtn" class="text-xs text-red-500 hover:underline">Supprimer tout l'historique</button>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200">📋 Déroulement de la classe</h2>
                    <div id="journalEntries" class="space-y-6"></div>
                </div>
            </div>
        </div>

        <!-- ================= ONGLET 2 : TABLEAUX DE BORD & PROFILS ================= -->
        <div id="ongletBilan" class="hidden space-y-6 print-full-width">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- COUVERTURE DU RÉFÉRENTIEL FWB -->
                <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                    <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-4">📊 Couverture des Domaines</h2>
                    <div id="statistiquesDomaines" class="space-y-3.5 text-xs">
                        <!-- Rempli en JS -->
                    </div>
                </div>

                <!-- PROFIL INDIVIDUEL DE L'ÉLÈVE -->
                <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center border-b pb-2 mb-4 flex-wrap gap-2">
                        <h2 class="text-lg font-bold text-gray-800">🎯 Livret de Compétences Individuel</h2>
                        <select id="selectProfilEleve" onchange="chargerProfilEleve()" class="rounded-md border-gray-300 p-2 border text-sm no-print bg-indigo-50 font-semibold text-indigo-700">
                            <!-- Rempli en JS -->
                        </select>
                    </div>
                    <div id="contenuProfilEleve" class="space-y-4">
                        <!-- Rempli en JS lors de la sélection d'un élève -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const objectifsParDomaine = {
            transversal: ["Construire son identité, la confiance en soi et l'autonomie", "Coopérer, respecter les règles collectives et vivre ensemble", "S'exprimer, communiquer ses émotions et écouter l'autre", "Développer sa curiosité, sa créativité et l'esprit d'initiative"],
            art: ["Arts plastiques & visuels : Explorer outils et matières", "Arts plastiques & visuels : Production personnelle", "Éducation musicale : Explorer et produire des sons", "Éducation musicale : Mémoriser des chants", "Arts du spectacle : S'exprimer par le corps"],
            langues: ["Langage oral : Oser prendre la parole distinctement", "Langage oral : Comprendre un récit ou une consigne", "Langage oral : Prendre part à un dialogue", "Éveil à l'écrit : Manipuler le livre et le sens de lecture", "Éveil à l'écrit : Reconnaître son prénom et des lettres", "Éveil aux langues : Percevoir des sonorités différentes"],
            math: ["Nombres : Dénombrer une collection d'objets", "Nombres : Comparer des collections", "Nombres : Quantité et symbole numérique", "Formes : Reconnaître les formes géométriques planes", "Grandeurs : Classer, trier et sérier des objets", "Espace : Utiliser des repères spatiaux", "Temps : Se repérer dans la journée, la semaine"],
            sciences: ["Sciences du vivant : Caractéristiques d'animaux/végétaux", "Matière & Technique : Explorer l'eau, l'air, les objets", "Sciences humaines : Se repérer dans l'environnement social", "Philosophie & Citoyenneté : Discussion philosophique"],
            sante: ["Psychomotricité globale : Équilibre et mouvements", "Psychomotricité globale : Ajuster ses déplacements", "Psychomotricité fine : Pince, découpage, enfilage", "Psychomotricité fine : Graphisme et coordination", "Santé & Bien-être : Gestes d'hygiène et alimentation"]
        };

        let journalData = JSON.parse(localStorage.getItem('monJournalMaternellePro')) || [];
        let elevesData = JSON.parse(localStorage.getItem('mesElevesMaternelle')) || ["Lucas", "Emma", "Nathan", "Chloé", "Arthur", "Léa"];
        let tempPhotoBase64 = "";

        // CHANGER D'ONGLET
        function changerOnglet(onglet) {
            const tabJournalBtn = document.getElementById('tabJournalBtn');
            const tabBilanBtn = document.getElementById('tabBilanBtn');
            const divJournal = document.getElementById('ongletJournal');
            const divBilan = document.getElementById('ongletBilan');

            if (onglet === 'journal') {
                divJournal.classList.remove('hidden'); divBilan.classList.add('hidden');
                tabJournalBtn.className = "py-2.5 px-4 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 transition";
                tabBilanBtn.className = "py-2.5 px-4 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition";
            } else {
                divJournal.classList.add('hidden'); divBilan.classList.remove('hidden');
                tabBilanBtn.className = "py-2.5 px-4 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 transition";
                tabJournalBtn.className = "py-2.5 px-4 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition";
                genererStatistiquesGlobales();
                chargerProfilEleve();
            }
        }

        // CLASSE & ÉLÈVES
        function afficherGestionEleves() {
            const listeElevesGestion = document.getElementById('listeElevesGestion');
            const grilleSuiviFormulaire = document.getElementById('grilleSuiviFormulaire');
            const selectProfilEleve = document.getElementById('selectProfilEleve');
            
            listeElevesGestion.innerHTML = ""; grilleSuiviFormulaire.innerHTML = "";
            const profilSelectionnePrecedent = selectProfilEleve.value;
            selectProfilEleve.innerHTML = "";

            elevesData.sort().forEach(prenom => {
                // Gestion
                const span = document.createElement('span');
                span.className = "inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded border border-indigo-200 font-medium";
                span.innerHTML = `${prenom} <button type="button" onclick="supprimerEleve('${prenom}')" class="text-red-500 ml-1">×</button>`;
                listeElevesGestion.appendChild(span);

                // Note d'évaluation
                const divRow = document.createElement('div');
                divRow.className = "flex items-center justify-between bg-white p-1 rounded border border-gray-200";
                divRow.innerHTML = `<span>${prenom}</span><select data-eleve="${prenom}" class="eleve-statut-select rounded border p-0.5 bg-gray-50"><option value="">-</option><option value="🟢 Acquis">🟢 Acquis</option><option value="🟡 En cours">🟡 En cours</option><option value="🔴 A renforcer">🔴 A renf.</option></select>`;
                grilleSuiviFormulaire.appendChild(divRow);

                // Menu déroulant bilan
                const opt = document.createElement('option');
                opt.value = prenom; opt.textContent = `Profil de ${prenom}`;
                selectProfilEleve.appendChild(opt);
            });
            if(profilSelectionnePrecedent && elevesData.includes(profilSelectionnePrecedent)) selectProfilEleve.value = profilSelectionnePrecedent;
        }

        function ajouterEleve() {
            const input = document.getElementById('nouvelEleveInput'); const p = input.value.trim();
            if(p && !elevesData.includes(p)) {
                elevesData.push(p); localStorage.setItem('mesElevesMaternelle', JSON.stringify(elevesData));
                input.value = ""; afficherGestionEleves();
            }
        }

        window.supprimerEleve = function(p) {
            if(confirm(`Supprimer ${p} ?`)) {
                elevesData = elevesData.filter(e => e !== p); localStorage.setItem('mesElevesMaternelle', JSON.stringify(elevesData)); afficherGestionEleves();
            }
        }

        function mettreAJourObjectifs() {
            const dom = document.getElementById('domaineInput').value; const objSelect = document.getElementById('objectifInput');
            objSelect.innerHTML = ""; objectifsParDomaine[dom].forEach(obj => {
                const opt = document.createElement('option'); opt.value = obj; opt.textContent = obj; objSelect.appendChild(opt);
            });
        }

        // RENDU JAVASCRIPT DU JOURNAL CHRONOLOGIQUE
        function afficherJournal() {
            const container = document.getElementById('journalEntries'); container.innerHTML = '';
            const fDomaine = document.getElementById('filtreDomaine').value;
            const tRecherche = document.getElementById('rechercheTexte').value.toLowerCase();

            let filtre = journalData.filter(e => (fDomaine === "Tous" || e.domaineTexte.includes(fDomaine)) && (!tRecherche || e.titre.toLowerCase().includes(tRecherche) || e.description.toLowerCase().includes(tRecherche)));

            if(filtre.length === 0) { container.innerHTML = `<p class="text-gray-400 italic text-center py-6">Aucune fiche.</p>`; return; }

            [...filtre].reverse().forEach(entree => {
                const div = document.createElement('div');
                div.className = "p-5 border border-gray-200 rounded-xl bg-gray-50 shadow-sm space-y-3 border-l-4 border-l-indigo-600 page-break-inside-avoid relative";
                const dateFormatee = new Date(entree.date).toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                
                let suiviHtml = "";
                if(entree.suivi && Object.keys(entree.suivi).length > 0) {
                    suiviHtml = `<div class="mt-2 pt-2 border-t border-gray-200 flex flex-wrap gap-1.5 text-xs">`;
                    for(const [nom, stat] of Object.entries(entree.suivi)) {
                        let c = "bg-gray-100 text-gray-600";
                        if(stat.includes("Acquis")) c = "bg-green-50 text-green-700 border-green-200";
                        if(stat.includes("cours")) c = "bg-yellow-50 text-yellow-700 border-yellow-200";
                        if(stat.includes("renforcer")) c = "bg-red-50 text-red-700 border-red-200";
                        suiviHtml += `<span class="px-2 py-0.5 rounded border ${c}"><strong>${nom} :</strong> ${stat.replace(/🟢|🟡|🔴/g, '')}</span>`;
                    }
                    suiviHtml += `</div>`;
                }

                div.innerHTML = `
                    <div class="flex justify-between items-start flex-wrap gap-2 border-b pb-2 border-gray-200 pr-16">
                        <div><span class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-md uppercase tracking-wider mr-2">${entree.moment}</span><h3 class="text-xl font-bold text-gray-800 inline-block mt-1 md:mt-0">${entree.titre}</h3></div>
                        <span class="text-sm text-gray-500 font-medium capitalize">${dateFormatee}</span>
                    </div>
                    <button onclick="clonerActivite(${entree.id})" class="no-print absolute top-4 right-4 bg-gray-200 text-gray-600 text-xs px-2 py-1 rounded">👯 Copier</button>
                    <div class="flex flex-wrap gap-2 text-xs">
                        <span class="text-emerald-800 font-semibold bg-emerald-50 px-2 py-1 rounded border border-emerald-200">🎯 ${entree.domaineTexte}</span>
                        <span class="text-blue-800 font-medium bg-blue-50 px-2 py-1 rounded border border-blue-200">🔑 ${entree.objectif}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                        <div class="${entree.photo ? 'md:col-span-2' : 'md:col-span-3'} space-y-1">
                            <p class="text-gray-700 whitespace-pre-line"><strong>Déroulement :</strong><br>${entree.description || '/'}</p>
                            ${entree.observations ? `<div class="bg-amber-50 border-l-4 border-amber-400 p-2 rounded text-amber-900"><strong>Obs :</strong> ${entree.observations}</div>` : ''}
                        </div>
                        ${entree.photo ? `<div class="flex justify-center items-center"><img src="${entree.photo}" class="max-h-36 rounded-lg object-cover w-full"></div>` : ''}
                    </div>
                    ${suiviHtml}
                `;
                container.appendChild(div);
            });
        }

        // MODULE ANALYTICS : COUVERTURE DU PROGRAMME FWB
        function genererStatistiquesGlobales() {
            const statsContainer = document.getElementById('statistiquesDomaines');
            statsContainer.innerHTML = "";
            const totalFiches = journalData.length;

            const clesDomaines = {
                "transversal": "Visées transversales",
                "art": "1. Éducation artistique",
                "langues": "2. Français & Langues",
                "math": "3. Mathématiques",
                "sciences": "4. Sciences & Philo",
                "sante": "5. Psychomotricité"
            };

            Object.entries(clesDomaines).forEach(([cle, label]) => {
                const count = journalData.filter(f => f.domaineCle === cle).length;
                const pourcentage = totalFiches > 0 ? Math.round((count / totalFiches) * 100) : 0;

                const divBar = document.createElement('div');
                divBar.className = "space-y-1";
                divBar.innerHTML = `
                    <div class="flex justify-between font-medium text-gray-700"><span>${label}</span><span class="font-bold">${count} fiche(s) (${pourcentage}%)</span></div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5"><div class="bg-indigo-600 h-2.5 rounded-full" style="width: ${pourcentage}%"></div></div>
                `;
                statsContainer.appendChild(divBar);
            });
        }

        // MODULE BILAN : CARNET DE COMPÉTENCES INDIVIDUEL DE L'ÉLÈVE
        window.chargerProfilEleve = function() {
            const prenom = document.getElementById('selectProfilEleve').value;
            const container = document.getElementById('contenuProfilEleve');
            container.innerHTML = "";

            if(!prenom) { container.innerHTML = `<p class="text-gray-400 italic">Aucun élève sélectionné.</p>`; return; }

            // Filtrer les activités où l'élève possède une évaluation enregistrée
            const fichesEleve = journalData.filter(f => f.suivi && f.suivi[prenom]);

            if(fichesEleve.length === 0) {
                container.innerHTML = `<p class="text-gray-400 italic text-center py-6">Aucune activité notée pour ${prenom} jusqu'à présent.</p>`;
                return;
            }

            fichesEleve.reverse().forEach(fiche => {
                const statut = fiche.suivi[prenom];
                let cssColor = "bg-gray-100 text-gray-700";
                if(statut.includes("Acquis")) cssColor = "bg-green-100 text-green-800 font-bold border border-green-300";
                if(statut.includes("cours")) cssColor = "bg-yellow-100 text-yellow-800 font-bold border border-yellow-300";
                if(statut.includes("renforcer")) cssColor = "bg-red-100 text-red-800 font-bold border border-red-300";

                const dateFormatee = new Date(fiche.date).toLocaleDateString('fr-BE', {day:'numeric', month:'short'});

                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200 gap-4";
                item.innerHTML = `
                    <div class="text-sm">
                        <span class="text-xs text-gray-400 mr-2 font-mono">${dateFormatee}</span>
                        <strong class="text-gray-800">${fiche.titre}</strong>
                        <div class="text-xs text-gray-500 mt-0.5">🎯 ${fiche.objectif}</div>
                    </div>
                    <span class="text-xs px-3 py-1 rounded-full ${cssColor}">${statut}</span>
                `;
                container.appendChild(item);
            });
        }

        // ENREGISTREMENT ET SOUMISSION
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const groupes = []; document.querySelectorAll('.groupe-chk:checked').forEach(c => groupes.push(c.value));
            const suivi = {}; document.querySelectorAll('.eleve-statut-select').forEach(s => { if(s.value) suivi[s.getAttribute('data-eleve')] = s.value; });

            const domSelect = document.getElementById('domaineInput');
            const nouvelleActivite = {
                id: Date.now(), date: document.getElementById('dateInput').value, moment: document.getElementById('momentInput').value,
                titre: document.getElementById('titreInput').value, domaineCle: domSelect.value, domaineTexte: domSelect.options[domSelect.selectedIndex].text,
                objectif: document.getElementById('objectifInput').value, groupes, suivi, description: document.getElementById('descInput').value,
                observations: document.getElementById('obsInput').value, photo: tempPhotoBase64
            };

            try {
                journalData.push(nouvelleActivite); localStorage.setItem('monJournalMaternellePro', JSON.stringify(journalData));
                form.reset(); document.getElementById('dateInput').valueAsDate = new Date(); tempPhotoBase64 = "";
                afficherGestionEleves(); mettreAJourObjectifs(); afficherJournal();
            } catch(err) { alert("Mémoire pleine ! Réduisez la taille de vos photos."); journalData.pop(); }
        });

        // ACTION CLONER, EXPORT & DICTÉE
        window.clonerActivite = function(id) {
            const c = journalData.find(e => e.id === id);
            if(c) {
                document.getElementById('titreInput').value = c.titre; document.getElementById('domaineInput').value = c.domaineCle; mettreAJourObjectifs();
                document.getElementById('objectifInput').value = c.objectif; document.getElementById('momentInput').value = c.moment;
                document.getElementById('descInput').value = c.description; document.getElementById('obsInput').value = c.observations; tempPhotoBase64 = c.photo;
                document.querySelectorAll('.groupe-chk').forEach(chk => chk.checked = c.groupes.includes(chk.value));
                document.querySelectorAll('.eleve-statut-select').forEach(s => { const n = s.getAttribute('data-eleve'); s.value = (c.suivi && c.suivi[n]) ? c.suivi[n] : ""; });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        function activerDictee(id) {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!Speech) return; const rec = new Speech(); rec.lang = 'fr-BE'; const b = event.target; b.textContent = "🛑 Écoute...";
            rec.onresult = (e) => { document.getElementById(id).value += " " + e.results[0][0].transcript; b.textContent = "🎙️ Dicter"; };
            rec.onend = () => b.textContent = "🎙️ Dicter"; rec.start();
        }

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if(file) { const r = new FileReader(); r.onload = (ev) => tempPhotoBase64 = ev.target.result; r.readAsDataURL(file); }
        });

        window.exporterJournal = function() {
            const pack = { journal: journalData, eleves: elevesData };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(pack));
            const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "sauvegarde_journal.json");
            document.body.appendChild(a); a.click(); a.remove();
        };

        window.importerJournal = function(input) {
            const file = input.files[0]; if(file) {
                const r = new FileReader(); r.onload = (e) => {
                    try {
                        const p = JSON.parse(e.target.result); if(p.journal && p.eleves) {
                            journalData = p.journal; elevesData = p.eleves;
                            localStorage.setItem('monJournalMaternellePro', JSON.stringify(journalData)); localStorage.setItem('mesElevesMaternelle', JSON.stringify(elevesData));
                            afficherGestionEleves(); afficherJournal();
                        }
                    } catch(x) { alert("Erreur."); }
                }; r.readAsText(file);
            }
        };

        document.getElementById('filtreDomaine').addEventListener('change', afficherJournal);
        document.getElementById('rechercheTexte').addEventListener('input', afficherJournal);
        document.getElementById('clearBtn').addEventListener('click', () => { if(confirm("Tout effacer ?")) { journalData = []; localStorage.removeItem('monJournalMaternellePro'); afficherJournal(); } });

        // INITIALISATION
        afficherGestionEleves();
        mettreAJourObjectifs();
        afficherJournal();
    </script>
</body>
</html>
