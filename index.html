<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal de Classe - Enseignement Catholique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdfa; }
        .maternelle-card { border-radius: 2rem; }
        .bg-pastel-blue { background-color: #e0f2fe; }
        .bg-pastel-green { background-color: #f0fdf4; }
        .bg-pastel-pink { background-color: #fdf2f8; }
        .bg-pastel-orange { background-color: #fff7ed; }
        
        @media print {
            .no-print { display: none !important; }
            .print-grid { display: block !important; }
            .day-column { page-break-after: always; border: 2px solid #e2e8f0 !important; margin-bottom: 20px; }
            body { background: white; }
        }

        /* Personnalisation des barres de défilement */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #99f6e4; border-radius: 10px; }
    </style>
</head>
<body class="p-0 m-0 text-slate-700">

    <header class="bg-teal-400 text-white p-6 shadow-lg no-print relative overflow-hidden">
        <div class="absolute top-0 right-0 opacity-20 text-9xl">🎈</div>
        <div class="max-w-7xl mx-auto flex justify-between items-center relative z-10">
            <div class="flex items-center space-x-4">
                <span class="text-5xl">🎒</span>
                <div>
                    <h1 class="text-3xl font-800 tracking-tight">Mon Journal de Classe</h1>
                    <p class="text-teal-100 font-semibold">Programme Enseignement Catholique (SeGEC)</p>
                </div>
            </div>
            <div class="flex space-x-3">
                <button onclick="window.print()" class="bg-white text-teal-600 hover:bg-teal-50 px-6 py-3 rounded-full font-bold shadow-md transition transform hover:scale-105">
                    🖨️ Imprimer
                </button>
                <button onclick="clearAll()" class="bg-rose-400 text-white hover:bg-rose-500 px-6 py-3 rounded-full font-bold shadow-md transition transform hover:scale-105">
                    🗑️ Reset
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        
        <section class="bg-white p-8 maternelle-card shadow-xl border-4 border-teal-100 mb-10 no-print">
            <h2 class="text-2xl font-bold text-teal-600 mb-6 flex items-center">
                <span class="bg-teal-100 p-2 rounded-full mr-3">📝</span> Nouvel encodage
            </h2>
            
            <form id="activityForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-2">📅 Jour</label>
                        <select id="day" class="w-full border-2 border-slate-100 rounded-2xl p-3 bg-slate-50 focus:border-teal-400 outline-none">
                            <option>Lundi</option><option>Mardi</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-2">⏰ Moment</label>
                        <select id="moment" class="w-full border-2 border-slate-100 rounded-2xl p-3 bg-slate-50 focus:border-teal-400 outline-none">
                            <option>Accueil / Rituels</option>
                            <option>Activités dirigées (Matin)</option>
                            <option>Collation / Récréation</option>
                            <option>Ateliers tournants</option>
                            <option>Psychomotricité</option>
                            <option>Repas / Sieste</option>
                            <option>Activités (Après-midi)</option>
                            <option>Regroupement / Départ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-2">⏳ Durée</label>
                        <select id="duration" class="w-full border-2 border-slate-100 rounded-2xl p-3 bg-slate-50 focus:border-teal-400 outline-none">
                            <option>10 min</option><option>15 min</option><option>20 min</option><option>30 min</option><option>45 min</option><option>60 min</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 mb-2">👥 Dispositif</label>
                        <select id="mode" class="w-full border-2 border-slate-100 rounded-2xl p-3 bg-slate-50 focus:border-teal-400 outline-none">
                            <option>Collectif (Grand groupe)</option>
                            <option>Petit groupe dirigé</option>
                            <option>Individuel / Autonomie</option>
                            <option>Par deux</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-teal-50 p-4 rounded-3xl">
                    <div>
                        <label class="block text-xs font-bold text-teal-700 uppercase mb-1">Matière</label>
                        <select id="subject" onchange="updateDomains()" class="w-full border-0 rounded-xl p-2 shadow-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-teal-700 uppercase mb-1">Domaine</label>
                        <select id="domain" onchange="updateCompetencies()" class="w-full border-0 rounded-xl p-2 shadow-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-teal-700 uppercase mb-1">Compétence</label>
                        <select id="competency" onchange="updateObjectives()" class="w-full border-0 rounded-xl p-2 shadow-sm outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-teal-700 uppercase mb-1">Objectif (visé)</label>
                        <select id="objective" class="w-full border-0 rounded-xl p-2 shadow-sm outline-none"></select>
                    </div>
                </div>

                <div class="space-y-4">
                    <input type="text" id="title" placeholder="Titre de l'activité (ex: Peinture aux doigts)" class="w-full border-2 border-slate-100 rounded-2xl p-3 font-bold text-lg outline-none focus:border-teal-400">
                    <textarea id="description" rows="2" placeholder="Description de l'activité..." class="w-full border-2 border-slate-100 rounded-2xl p-3 outline-none focus:border-teal-400"></textarea>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <textarea id="setup" placeholder="Dispositif spatial / Matériel..." class="w-full border-2 border-slate-100 rounded-2xl p-3 outline-none focus:border-teal-400"></textarea>
                        <textarea id="evaluation" placeholder="Évaluation / Observations..." class="w-full border-2 border-slate-100 rounded-2xl p-3 outline-none focus:border-teal-400"></textarea>
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="bg-teal-500 text-white px-10 py-4 rounded-full font-bold text-lg shadow-lg hover:bg-teal-600 transition transform hover:-translate-y-1">
                        ✨ Ajouter au journal
                    </button>
                </div>
            </form>
        </section>

        <div id="journalGrid" class="grid grid-cols-1 xl:grid-cols-5 gap-6 print-grid"></div>

    </main>

    <script>
        // --- DONNÉES SEGEC (Simplifiées pour l'exemple, à compléter selon vos besoins) ---
        const segecData = {
            "Développement Cognitif": {
                "Mathématiques": {
                    "Nombres et Opérations": ["Dénombrer", "Comparer des quantités", "Associer chiffre et quantité"],
                    "Solides et Figures": ["Reconnaître les formes", "Trier selon la forme"],
                    "Grandeurs": ["Comparer des tailles", "Mesurer avec un étalon"]
                },
                "Éveil Scientifique": {
                    "Le monde vivant": ["Observer la croissance", "Identifier les parties du corps"],
                    "La matière": ["Expérimenter les mélanges", "Flotte ou coule"]
                }
            },
            "Langues et Communication": {
                "Français - Oral": {
                    "Parler": ["Prendre la parole", "Raconter un récit"],
                    "Écouter": ["Comprendre une consigne", "Écouter une histoire"]
                },
                "Français - Écrit": {
                    "Lecture": ["Reconnaître son prénom", "Identifier des logos"],
                    "Écriture": ["Graphisme (lignes)", "Tracer des lettres"]
                }
            },
            "Développement Artistique": {
                "Arts Plastiques": {
                    "Techniques": ["Découper", "Peindre", "Modeler"],
                    "Couleurs": ["Identifier les primaires", "Créer des mélanges"]
                }
            }
        };

        // --- GESTION DES MENUS DÉROULANTS LIÉS ---
        function populateDropdown(id, items) {
            const select = document.getElementById(id);
            select.innerHTML = '';
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                select.appendChild(opt);
            });
        }

        function updateDomains() {
            const subject = document.getElementById('subject').value;
            populateDropdown('domain', Object.keys(segecData[subject]));
            updateCompetencies();
        }

        function updateCompetencies() {
            const subject = document.getElementById('subject').value;
            const domain = document.getElementById('domain').value;
            populateDropdown('competency', Object.keys(segecData[subject][domain]));
            updateObjectives();
        }

        function updateObjectives() {
            const subject = document.getElementById('subject').value;
            const domain = document.getElementById('domain').value;
            const competency = document.getElementById('competency').value;
            populateDropdown('objective', segecData[subject][domain][competency]);
        }

        // --- LOGIQUE APPLICATION ---
        let journalData = JSON.parse(localStorage.getItem('journalSegec')) || [];

        document.getElementById('activityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const act = {
                id: Date.now(),
                day: document.getElementById('day').value,
                moment: document.getElementById('moment').value,
                duration: document.getElementById('duration').value,
                mode: document.getElementById('mode').value,
                subject: document.getElementById('subject').value,
                domain: document.getElementById('domain').value,
                competency: document.getElementById('competency').value,
                objective: document.getElementById('objective').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                setup: document.getElementById('setup').value,
                evaluation: document.getElementById('evaluation').value
            };
            journalData.push(act);
            saveAndRender();
            this.reset();
            updateDomains();
        });

        function saveAndRender() {
            localStorage.setItem('journalSegec', JSON.stringify(journalData));
            renderJournal();
        }

        function deleteActivity(id) {
            journalData = journalData.filter(a => a.id !== id);
            saveAndRender();
        }

        function clearAll() {
            if(confirm("Effacer toute la semaine ?")) {
                journalData = [];
                saveAndRender();
            }
        }

        function renderJournal() {
            const grid = document.getElementById('journalGrid');
            grid.innerHTML = '';
            const days = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];

            days.forEach(d => {
                const col = document.createElement('div');
                col.className = "day-column bg-white rounded-[2rem] p-4 shadow-md border-2 border-teal-50";
                col.innerHTML = `<h3 class="text-xl font-800 text-teal-500 mb-4 text-center border-b-2 border-teal-50 pb-2">${d}</h3>`;
                
                const acts = journalData.filter(a => a.day === d);
                acts.forEach(a => {
                    const card = document.createElement('div');
                    card.className = "relative p-4 mb-4 rounded-3xl border-2 border-slate-50 bg-teal-50/30 hover:bg-teal-50 transition";
                    card.innerHTML = `
                        <button onclick="deleteActivity(${a.id})" class="no-print absolute top-2 right-2 text-slate-300 hover:text-rose-500">✕</button>
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="text-[10px] font-bold bg-white px-2 py-1 rounded-full shadow-sm text-teal-600">${a.moment}</span>
                            <span class="text-[10px] font-bold bg-teal-200 px-2 py-1 rounded-full text-teal-800">${a.duration}</span>
                        </div>
                        <h4 class="font-bold text-teal-700 leading-tight mb-1 uppercase text-xs">${a.title}</h4>
                        <p class="text-[11px] text-slate-500 mb-2 italic">${a.mode}</p>
                        
                        <div class="text-[10px] bg-white/80 p-2 rounded-xl border border-teal-100 mb-2">
                            <strong class="text-teal-600">Comp :</strong> ${a.competency}<br>
                            <strong class="text-teal-600">Obj :</strong> ${a.objective}
                        </div>

                        <p class="text-[11px] text-slate-600 line-clamp-3">${a.description}</p>
                        
                        ${a.evaluation ? `<div class="mt-2 pt-2 border-t border-teal-100 text-[10px] text-rose-500 italic">⭐ ${a.evaluation}</div>` : ''}
                    `;
                    col.appendChild(card);
                });
                grid.appendChild(col);
            });
        }

        // Init
        populateDropdown('subject', Object.keys(segecData));
        updateDomains();
        renderJournal();
    </script>
</body>
</html>
