<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal de Classe Numérique (Style Teetsh)</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #dddddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--primary); font-size: 24px; }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="date"], select, button {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button.btn-danger { background-color: #e74c3c; }
        button.btn-danger:hover { background-color: #c0392b; }

        /* Grille de la journée */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .period-card {
            background: var(--card-bg);
            border-left: 5px solid var(--primary);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 150px 1fr 2fr 40px;
            gap: 15px;
            align-items: center;
        }

        .period-time {
            font-weight: bold;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .period-time input {
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
            width: 90px;
        }

        .period-program select {
            width: 100%;
            background: #fafafa;
        }

        .period-content textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
        }

        .delete-btn {
            background: none;
            color: #ccc;
            font-size: 20px;
            cursor: pointer;
            border: none;
            padding: 0;
        }
        .delete-btn:hover { color: #e74c3c; background: none; }

        @media (max-width: 768px) {
            .period-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>📓 Mon Journal de Classe Maternelle</h1>
            <small>Programmes de référence : SeGEC</small>
        </div>
        <div class="controls">
            <label for="journal-date">Date :</label>
            <input type="date" id="journal-date">
            <button id="add-period-btn">+ Ajouter une période</button>
        </div>
    </header>

    <main id="journal-timeline" class="timeline">
        <!-- Les périodes s'afficheront ici via JavaScript -->
    </main>

    <script>
        // --- DONNÉES DU PROGRAMME SEGEC ---
        const segecProgram = {
            "Vol 1 : Autonomie & Psychomotricité": [
                "Autonomie et Socialisation",
                "Psychomotricité : Schéma corporel & Latéralité",
                "Psychomotricité : Motricité globale",
                "Psychomotricité : Motricité fine",
                "Psychomotricité : Bien-être & Santé",
                "Philo et Citoyenneté (EPC)",
                "Religion Catholique"
            ],
            "Vol 2 : Langues, Culture & Arts": [
                "Français : Parler / Communiquer",
                "Français : Écouter / Comprendre",
                "Français : Entrer dans l'écrit (Lecture)",
                "Français : Graphisme / Écriture",
                "Éveil aux Langues",
                "Arts : Plastiques, visuels et de l'espace",
                "Arts : Éducation musicale",
                "Arts : Spectacle (Mime, danse...)"
            ],
            "Vol 3 : STEM & Sciences Humaines": [
                "Math : Nombres et Opérations",
                "Math : Solides et Figures",
                "Math : Grandeurs",
                "Éveil : Le vivant (Sciences)",
                "Éveil : La matière et l'énergie",
                "Histoire/Géo : Le Temps",
                "Histoire/Géo : L'Espace",
                "FMTTN (Technologie & Numérique)"
            ],
            "Autre": [
                "Accueil / Rituels",
                "Récréation",
                "Sieste / Repos",
                "Collation"
            ]
        };

        // --- GESTION DE L'APPLICATION ---
        const dateInput = document.getElementById('journal-date');
        const timeline = document.getElementById('journal-timeline');
        const addPeriodBtn = document.getElementById('add-period-btn');

        // Définir la date du jour par défaut (YYYY-MM-DD)
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        // Base de données locale (simulée dans le localStorage)
        let journalData = JSON.parse(localStorage.getItem('segec_journal_db')) || {};

        // Charger la journée sélectionnée
        function loadJournalDay() {
            const selectedDate = dateInput.value;
            timeline.innerHTML = '';

            // Si aucune donnée pour ce jour, on peut charger une structure par défaut
            if (!journalData[selectedDate] || journalData[selectedDate].length === 0) {
                journalData[selectedDate] = [
                    { start: "08:30", end: "09:00", domaine: "Accueil / Rituels", description: "Accueil des enfants, calendrier et météo." },
                    { start: "09:00", end: "10:00", domaine: "Français : Parler / Communiquer", description: "" }
                ];
            }

            journalData[selectedDate].forEach((period, index) => {
                createPeriodDOM(period, index);
            });
        }

        // Créer l'affichage HTML d'une période
        function createPeriodDOM(period, index) {
            const card = document.createElement('div');
            card.className = 'period-card';

            // HTML des sélections du programme SeGEC
            let selectHTML = `<select onchange="updatePeriod(${index}, 'domaine', this.value)">`;
            for (const [group, items] of Object.entries(segecProgram)) {
                selectHTML += `<optgroup label="${group}">`;
                items.forEach(item => {
                    const selected = period.domaine === item ? 'selected' : '';
                    selectHTML += `<option value="${item}" ${selected}>${item}</option>`;
                });
                selectHTML += `</optgroup>`;
            }
            selectHTML += `</select>`;

            card.innerHTML = `
                <div class="period-time">
                    <input type="time" value="${period.start}" onchange="updatePeriod(${index}, 'start', this.value)">
                    <input type="time" value="${period.end}" onchange="updatePeriod(${index}, 'end', this.value)">
                </div>
                <div class="period-program">
                    <label style="font-size:12px; color:#777; font-weight:bold;">Domaine SeGEC :</label>
                    ${selectHTML}
                </div>
                <div class="period-content">
                    <textarea placeholder="Objectifs, déroulement de l'activité, matériel..." oninput="updatePeriod(${index}, 'description', this.value)">${period.description}</textarea>
                </div>
                <button class="delete-btn" onclick="deletePeriod(${index})" title="Supprimer">🗑️</button>
            `;

            timeline.appendChild(card);
        }

        // Mettre à jour une donnée et sauvegarder
        window.updatePeriod = function(index, field, value) {
            const selectedDate = dateInput.value;
            journalData[selectedDate][index][field] = value;
            saveData();
        };

        // Ajouter une nouvelle période
        addPeriodBtn.addEventListener('click', () => {
            const selectedDate = dateInput.value;
            const newPeriod = { start: "10:00", end: "11:00", domaine: "Autonomie et Socialisation", description: "" };
            journalData[selectedDate].push(newPeriod);
            saveData();
            loadJournalDay();
        });

        // Supprimer une période
        window.deletePeriod = function(index) {
            if(confirm("Supprimer cette période de votre journée ?")) {
                const selectedDate = dateInput.value;
                journalData[selectedDate].splice(index, 1);
                saveData();
                loadJournalDay();
            }
        };

        function saveData() {
            localStorage.setItem('segec_journal_db', JSON.stringify(journalData));
        }

        // Événement changement de date
        dateInput.addEventListener('change', loadJournalDay);

        // Initialisation au démarrage
        loadJournalDay();
    </script>
</body>
</html>
