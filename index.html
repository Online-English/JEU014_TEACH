<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal de Classe Maternelle (FWB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white; color: black; }
            .no-print { display: none !important; }
            .print-card { page-break-inside: avoid; border: 1px solid #ccc !important; box-shadow: none !important; }
            .grid { display: block !important; }
            .day-column { margin-bottom: 2rem; page-break-after: auto; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <header class="bg-indigo-600 text-white shadow-md p-4 no-print flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">✏️</span>
            <div>
                <h1 class="text-xl font-bold">Mon Journal de Classe</h1>
                <p class="text-xs text-indigo-200">Enseignement Maternel — Wallonie</p>
            </div>
        </div>
        <div class="flex space-x-2">
            <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
                🖨️ Imprimer la semaine
            </button>
            <button onclick="clearAll()" class="bg-rose-500 hover:bg-rose-600 px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
                🗑️ Tout effacer
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6">
        
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 no-print">
            <h2 class="text-lg font-bold text-indigo-700 mb-4 flex items-center">
                <span class="mr-2">➕</span> Ajouter ou Modifier une Activité / un Atelier
            </h2>
            <form id="activityForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Jour</label>
                    <select id="day" class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                        <option value="Lundi">Lundi</option>
                        <option value="Mardi">Mardi</option>
                        <option value="Mercredi">Mercredi</option>
                        <option value="Jeudi">Jeudi</option>
                        <option value="Vendredi">Vendredi</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Horaire / Moment</label>
                    <input type="text" id="time" placeholder="Ex: 09:00 - 09:45 ou Rituels" class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-indigo-500" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Domaine (Référentiel FWB)</label>
                    <select id="domain" class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                        <option value="Français / Langage">🗣️ Français, Langage & Communication</option>
                        <option value="Mathématiques">🧮 Mathématiques (Logique/Espace)</option>
                        <option value="Éveil / Sciences">🌱 Explorer le Monde / Éveil</option>
                        <option value="Psychomotricité / ÉPS">🏃 Éduc. Physique & Psychomotricité</option>
                        <option value="Éducation Artistique">🎨 Éducation Artistique & Culturelle</option>
                        <option value="FMTTN / Numérique">💻 FMTTN (Numérique)</option>
                        <option value="Vie Collective / Rituels">🤝 Autonomie & Vie Collective</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Intitulé de l'activité & Objectifs</label>
                    <input type="text" id="title" placeholder="Ex: Graphisme : Les lignes verticales. Objectif : Maîtriser le geste de haut en bas." class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-indigo-500" required>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Matériel & Organisation (Groupes, consignes...)</label>
                    <textarea id="details" rows="2" placeholder="Ex: Pâte à modeler, fiches plastifiées. En autonomie par table de 4." class="w-full border border-slate-300 rounded-lg p-2 bg-slate-50 focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div class="md:col-span-3 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg shadow transition">
                        Enregistrer dans l'agenda
                    </button>
                </div>
            </form>
        </section>

        <div id="journalGrid" class="grid grid-cols-1 xl:grid-cols-5 gap-6">
            </div>

    </main>

    <script>
        // Liste des jours de la semaine scolaire
        const days = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
        
        // Structure de stockage des couleurs par domaine (style Teetsh)
        const domainColors = {
            "Français / Langage": "bg-amber-50 border-amber-300 text-amber-900 badge-amber",
            "Mathématiques": "bg-blue-50 border-blue-300 text-blue-900 badge-blue",
            "Éveil / Sciences": "bg-emerald-50 border-emerald-300 text-emerald-900 badge-emerald",
            "Psychomotricité / ÉPS": "bg-purple-50 border-purple-300 text-purple-900 badge-purple",
            "Éducation Artistique": "bg-pink-50 border-pink-300 text-pink-900 badge-pink",
            "FMTTN / Numérique": "bg-slate-100 border-slate-400 text-slate-900 badge-slate",
            "Vie Collective / Rituels": "bg-teal-50 border-teal-300 text-teal-900 badge-teal"
        };

        // Charger les données depuis le LocalStorage ou initialiser à vide
        let journalData = JSON.parse(localStorage.getItem('journalMaternelle')) || [];

        // Éléments DOM
        const activityForm = document.getElementById('activityForm');
        const journalGrid = document.getElementById('journalGrid');

        // Gestion de la soumission du formulaire
        activityForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const newActivity = {
                id: Date.now(),
                day: document.getElementById('day').value,
                time: document.getElementById('time').value,
                domain: document.getElementById('domain').value,
                title: document.getElementById('title').value,
                details: document.getElementById('details').value
            };

            journalData.push(newActivity);
            
            // Trier par horaire (approximation simple)
            journalData.sort((a, b) => a.time.localeCompare(b.time));

            saveAndRender();
            activityForm.reset();
        });

        // Sauvegarder dans LocalStorage et rafraîchir la vue
        function saveAndRender() {
            localStorage.setItem('journalMaternelle', JSON.stringify(journalData));
            renderJournal();
        }

        // Supprimer une activité spécifique
        function deleteActivity(id) {
            journalData = journalData.filter(act => act.id !== id);
            saveAndRender();
        }

        // Effacer toute la semaine
        function clearAll() {
            if (confirm("Êtes-vous sûre de vouloir effacer tout votre journal de classe pour cette semaine ?")) {
                journalData = [];
                saveAndRender();
            }
        }

        // Générer le rendu visuel du journal de classe
        function renderJournal() {
            journalGrid.innerHTML = '';

            days.forEach(day => {
                // Créer la colonne du jour
                const dayColumn = document.createElement('div');
                dayColumn.className = "day-column bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-4";
                
                // Entête du jour
                dayColumn.innerHTML = `
                    <div class="border-b border-slate-100 pb-2 mb-1">
                        <h3 class="font-bold text-lg text-slate-700">${day}</h3>
                    </div>
                    <div class="flex flex-col gap-3 flex-grow activities-container" id="container-${day}"></div>
                `;

                journalGrid.appendChild(dayColumn);
                
                const container = document.getElementById(`container-${day}`);
                const dayActivities = journalData.filter(act => act.day === day);

                if (dayActivities.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 italic text-center my-4 no-print">Aucun moment encodé</p>`;
                } else {
                    dayActivities.forEach(act => {
                        const colorClass = domainColors[act.domain] || "bg-slate-50 border-slate-200 text-slate-700";
                        const cardClasses = colorClass.split(' ');

                        const activityCard = document.createElement('div');
                        activityCard.className = `print-card p-3 rounded-lg border-l-4 shadow-xs flex flex-col justify-between ${cardClasses[0]} ${cardClasses[1]}`;
                        
                        activityCard.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start mb-1">
                                    <span class="text-xs font-bold uppercase tracking-wider ${cardClasses[2]}">${act.time}</span>
                                    <button onclick="deleteActivity(${act.id})" class="no-print text-slate-400 hover:text-rose-500 transition text-sm">✕</button>
                                </div>
                                <div class="text-xs font-semibold px-1.5 py-0.5 rounded bg-white/60 inline-block mb-2 border border-black/5 text-slate-700">
                                    ${act.domain}
                                </div>
                                <h4 class="font-bold text-sm text-slate-900 leading-tight mb-1">${act.title}</h4>
                                ${act.details ? `<p class="text-xs text-slate-600 mt-1 whitespace-pre-line border-t border-black/5 pt-1 italic">${act.details}</p>` : ''}
                            </div>
                        `;
                        container.appendChild(activityCard);
                    });
                }
            });
        }

        // Initialisation au chargement de la page
        renderJournal();
    </script>
</body>
</html>
