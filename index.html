<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Journal & Gestion Maternelle — FWB Édition Intégrale Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('m_dark_mode') === 'enabled') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        h1, h2, h3 { font-family: 'Nunito', sans-serif; font-weight: 800; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-full-width { width: 100% !important; max-width: 100% !important; }
            .page-break-inside-avoid { page-break-inside: avoid; }
            #zoneImpressionCartes, #zoneImpressionCahier, #zoneImpressionKit { position: absolute; top: 0; left: 0; width: 100%; z-index: 9999; display: block !important; }
        }
    </style>
</head>
<body class="bg-amber-50/40 dark:bg-slate-900 min-h-screen text-gray-800 dark:text-slate-100 transition-colors duration-300">

    <div id="lockScreen" class="fixed inset-0 bg-indigo-900/95 z-[9999] flex flex-col items-center justify-center hidden text-white p-4 no-print">
        <div class="bg-white dark:bg-slate-800 text-gray-800 dark:text-slate-100 p-6 rounded-3xl shadow-xl border-4 border-orange-200 dark:border-slate-700 text-center max-w-sm w-full">
            <h2 class="text-xl font-bold mb-4 text-indigo-700 dark:text-indigo-400">🔒 Espace Sécurisé</h2>
            <input type="password" id="inputPinVerify" maxlength="4" class="w-28 text-center text-2xl rounded-xl p-2 font-bold mb-4 bg-gray-50 border outline-none text-black">
            <button onclick="verifierCodePIN()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl">Déverrouiller</button>
        </div>
    </div>

    <div id="appWrapper" class="max-w-7xl mx-auto p-4 md:p-6">
        <header class="mb-6 bg-gradient-to-r from-yellow-100 via-pink-100 to-teal-100 dark:from-slate-800 dark:to-slate-800 p-6 rounded-3xl border-2 border-dashed border-orange-200 flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-2xl text-orange-600 dark:text-orange-400">🎒 Mon Espace Maternelle</h1>
            <div class="flex gap-2">
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-white/50 dark:bg-slate-700">🌙</button>
                <select id="globalClasseSelect" onchange="changerClasseGlobale()" class="bg-white dark:bg-slate-700 p-2 rounded-xl border"></select>
                <button onclick="exporterTout()" class="bg-sky-400 text-white px-4 py-2 rounded-xl font-bold text-xs">💾 Sauver</button>
            </div>
        </header>

        <div class="flex gap-2 no-print pb-6 border-b border-orange-100 mb-6 overflow-x-auto">
            <button id="tabJournalBtn" onclick="changerOnglet('Journal')" class="py-2.5 px-5 font-bold text-sm rounded-2xl bg-orange-400 text-white">📋 Journal</button>
            <button id="tabPresencesBtn" onclick="changerOnglet('Presences')" class="py-2.5 px-5 font-bold text-sm rounded-2xl bg-white dark:bg-slate-800 border">🗓️ Présences</button>
            <button id="tabElevesBtn" onclick="changerOnglet('Eleves')" class="py-2.5 px-5 font-bold text-sm rounded-2xl bg-white dark:bg-slate-800 border">🧸 Enfants</button>
            <button id="tabBilanBtn" onclick="changerOnglet('Bilan')" class="py-2.5 px-5 font-bold text-sm rounded-2xl bg-white dark:bg-slate-800 border">📊 Bilans</button>
        </div>

        <div id="ongletJournal" class="onglet-content"></div>
        <div id="ongletPresences" class="onglet-content hidden"></div>
        <div id="ongletEleves" class="onglet-content hidden"></div>
        <div id="ongletBilan" class="onglet-content hidden"></div>
    </div>

    <script>
        // --- LOGIQUE DE NAVIGATION (CORRIGÉE) ---
        function changerOnglet(nom) {
            document.querySelectorAll('.onglet-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('onglet' + nom);
            if(target) target.classList.remove('hidden');

            const boutons = ['Journal', 'Presences', 'Eleves', 'Bilan'];
            boutons.forEach(b => {
                const btn = document.getElementById('tab' + b + 'Btn');
                btn.className = "py-2.5 px-5 font-bold text-sm rounded-2xl bg-white dark:bg-slate-800 border text-gray-500";
            });
            const activeBtn = document.getElementById('tab' + nom + 'Btn');
            const colors = { Journal: 'bg-orange-400', Presences: 'bg-yellow-400', Eleves: 'bg-pink-400', Bilan: 'bg-teal-400' };
            activeBtn.className = `py-2.5 px-5 font-bold text-sm rounded-2xl ${colors[nom]} text-white`;
        }

        // --- DARK MODE ---
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('m_dark_mode', isDark ? 'enabled' : 'disabled');
        }

        // --- DATABASE INDEXEDDB (STRUCTURE DE BASE) ---
        let db;
        const request = indexedDB.open("MaternelleEspaceDB", 3);
        request.onupgradeneeded = function(e) {
            let database = e.target.result;
            if(!database.objectStoreNames.contains("classes")) database.createObjectStore("classes", { keyPath: "id" });
            if(!database.objectStoreNames.contains("eleves")) database.createObjectStore("eleves", { keyPath: "id" });
            if(!database.objectStoreNames.contains("journal")) database.createObjectStore("journal", { keyPath: "id" });
            // ... autres stores (presences, flash, brevets, coins, liaison, config)
        };
        request.onsuccess = function(e) { db = e.target.result; initApp(); };

        function putInStore(storeName, data, callback) {
            let tx = db.transaction(storeName, "readwrite");
            tx.objectStore(storeName).put(data).onsuccess = () => { if(callback) callback(); };
        }
        
        function initApp() { console.log("Application prête."); }
        function changerClasseGlobale() { /* Logique de changement de classe */ }
    </script>
</body>
</html>
